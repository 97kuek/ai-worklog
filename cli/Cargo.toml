[package]
name = "taskfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
jiff = "1.0.2"
lexopt = "0.3.2"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
